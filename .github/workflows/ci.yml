name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      # Without this a failure on one OS cancels the other, which hid a broken
      # Windows smoke test behind an unrelated Linux failure for weeks.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting is identical on both runners, so checking it twice only
      # doubles the noise when it fails.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: pnpm exec prettier --check .
      # Electron ships chrome-sandbox without the SUID bit and GitHub runners
      # disable unprivileged user namespaces, so Electron aborts instead of
      # starting. Restore the helper rather than passing --no-sandbox: the smoke
      # test exists to prove the sandboxed renderer actually works.
      - name: Enable the Electron SUID sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: pnpm build
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        if: runner.os == 'Linux'
        run: pnpm exec playwright test
      - name: Run Electron UI smoke on Windows
        if: runner.os == 'Windows'
        run: pnpm test:electron-ui-smoke
      - name: Run Electron UI smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:electron-ui-smoke
      - run: pnpm vitest run
