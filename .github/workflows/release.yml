name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  # electron-builder looks for an existing draft and creates one if it finds
  # none, and it matches drafts by tag name. Two drafts carrying the same tag
  # are indistinguishable to it, so it scatters assets between them: v0.2.0
  # ended up with the installer in one draft and that installer's blockmap in
  # the other, which leaves the auto-updater with no complete latest*.yml to
  # read. Running the matrix one job at a time stops three jobs racing to create
  # the first draft, but it cannot help once a stale draft from an earlier run
  # of the same tag is already there. So the draft is created here, exactly
  # once, after every older draft for the tag is removed - which also makes
  # re-running a release idempotent.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset the draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" \
            | while read -r id; do
                echo "Removing stale draft $id for $TAG"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done
          # A published release for this tag is never touched: re-releasing over
          # something users already have must be a deliberate, manual act.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published. Delete it by hand or bump the version."
            exit 1
          fi
          # The tag already exists in both trigger modes, so the draft attaches
          # to it and no --target is needed.
          gh release create "$TAG" --draft --title "$TAG" --notes ""

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      # The single draft prepare created still has to be filled one job at a
      # time: concurrent uploads of latest*.yml race each other.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Electron ships chrome-sandbox without the SUID bit and GitHub runners
      # disable unprivileged user namespaces, so Electron aborts instead of
      # starting. Restore the helper rather than passing --no-sandbox: the smoke
      # test exists to prove the sandboxed renderer actually works.
      - name: Enable the Electron SUID sandbox helper
        if: matrix.platform == 'linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Stable release tag must be vMAJOR.MINOR.PATCH without prerelease suffix. Got: $tag"
          }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "Release tag $tag does not match package.json version $packageVersion"
          }

      - run: pnpm build

      - run: pnpm vitest run

      - name: Run Electron UI smoke
        if: matrix.platform != 'linux'
        run: pnpm test:electron-ui-smoke

      - name: Run Electron UI smoke on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:electron-ui-smoke

      # This project has no code-signing certificates, so every artifact ships
      # unsigned and CSC_IDENTITY_AUTO_DISCOVERY is off everywhere: without it
      # electron-builder hunts the runner keychain for an identity and fails the
      # build when it finds none. The consequences are real and documented in
      # README.md rather than papered over:
      #   - Windows: SmartScreen warns on first run of the installer.
      #   - macOS: Gatekeeper quarantines the app, and electron-updater cannot
      #     auto-update an unsigned macOS build, so mac users must download each
      #     release by hand. The in-app update check still reports new versions.
      # To start signing, add the certificate secrets back and set CSC_LINK plus
      # CSC_KEY_PASSWORD on the matching publish step.
      - name: Publish Windows Electron release
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish Linux Electron release
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish macOS Electron release
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
